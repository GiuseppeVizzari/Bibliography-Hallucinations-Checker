[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibcheck"
version = "1.11.0"
description = "Detect hallucinated bibliographic references in PDFs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "pymupdf>=1.28.2",
    "werkzeug>=3.1.9",
    "python-dotenv>=1.2.4",
    "pyalex>=0.20",
    "habanero>=2.9.2",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
